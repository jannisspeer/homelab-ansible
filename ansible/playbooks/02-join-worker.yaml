---
- name: Generate a short-lived join command for worker nodes
  hosts: "{{ groups['control_plane'][0] }}"
  become: true
  gather_facts: false
  tasks:
    - name: Create kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 2h
      register: worker_join_command
      changed_when: worker_join_command.rc == 0
      failed_when: worker_join_command.rc != 0
      no_log: true

    - name: Share worker join command with worker hosts
      ansible.builtin.set_fact:
        worker_join_command_value: "{{ worker_join_command.stdout }}"
      no_log: true

- name: Join worker nodes to the Kubernetes cluster
  hosts: workers
  become: true
  gather_facts: false
  vars:
    primary_control_plane: "{{ groups['control_plane'][0] }}"
    primary_control_plane_user: "{{ hostvars[groups['control_plane'][0]].ansible_user }}"
    primary_control_plane_kubeconfig: "/home/{{ hostvars[groups['control_plane'][0]].ansible_user }}/.kube/config"
    worker_node_name: "{{ inventory_hostname | lower }}"
  environment:
    KUBECONFIG: "{{ primary_control_plane_kubeconfig }}"
  tasks:
    - name: Check whether the worker is already registered in the cluster
      ansible.builtin.command: kubectl get node {{ worker_node_name }} -o json
      delegate_to: "{{ primary_control_plane }}"
      become_user: "{{ primary_control_plane_user }}"
      register: worker_node_status
      changed_when: false
      failed_when: worker_node_status.rc != 0 and 'NotFound' not in worker_node_status.stderr

    - name: Identify control-plane workers and their NoSchedule taints
      ansible.builtin.set_fact:
        worker_is_control_plane: >-
          {{ 'node-role.kubernetes.io/control-plane' in (worker_node_status.stdout | from_json).metadata.labels or
             'node-role.kubernetes.io/master' in (worker_node_status.stdout | from_json).metadata.labels }}
        worker_control_plane_taints: >-
          {{ (worker_node_status.stdout | from_json).spec.taints | default([])
             | selectattr('key', 'in', ['node-role.kubernetes.io/control-plane', 'node-role.kubernetes.io/master'])
             | selectattr('effect', 'equalto', 'NoSchedule') | list }}
      when: worker_node_status.rc == 0

    - name: Remove NoSchedule control-plane taints from existing control-plane workers
      ansible.builtin.command:
        argv:
          - kubectl
          - taint
          - nodes
          - "{{ worker_node_name }}"
          - "{{ item.key }}:NoSchedule-"
      delegate_to: "{{ primary_control_plane }}"
      become_user: "{{ primary_control_plane_user }}"
      register: control_plane_taint_removal
      changed_when: control_plane_taint_removal.rc == 0
      failed_when: control_plane_taint_removal.rc != 0
      loop: "{{ worker_control_plane_taints | default([]) }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - worker_node_status.rc == 0
        - worker_is_control_plane | default(false)

    - name: Configure kubelet to use the node's Kubernetes address
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: "KUBELET_EXTRA_ARGS=--node-ip={{ k8s_host }}"
        create: true
        mode: '0644'
      register: kubelet_node_ip_config

    - name: Restart kubelet when the node address changes
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: true
      when: kubelet_node_ip_config.changed

    - name: Join unregistered nodes as workers
      ansible.builtin.command: >-
        {{ hostvars[primary_control_plane].worker_join_command_value }}
        --node-name {{ worker_node_name }}
      register: worker_join_result
      changed_when: worker_join_result.rc == 0
      failed_when: worker_join_result.rc != 0
      no_log: true
      when: worker_node_status.rc != 0

    - name: Wait for worker node to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ worker_node_name }}"
          - --timeout=300s
      delegate_to: "{{ primary_control_plane }}"
      become_user: "{{ primary_control_plane_user }}"
      register: worker_ready
      changed_when: false
      failed_when: worker_ready.rc != 0

    - name: Get cluster node status
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - wide
      delegate_to: "{{ primary_control_plane }}"
      become_user: "{{ primary_control_plane_user }}"
      register: cluster_node_status
      changed_when: false
      run_once: true

    - name: Display cluster node status
      ansible.builtin.debug:
        var: cluster_node_status.stdout_lines
      run_once: true
